[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jabuti"
dynamic = ["version"]
description = "CLI para criação e padronização de projetos de software"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cli", "scaffolding", "react", "fastapi", "flask"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "questionary>=2.1,<3",
    "typer>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/catrique/jabuti"
Repository = "https://github.com/catrique/jabuti"
Issues = "https://github.com/catrique/jabuti/issues"

[project.scripts]
jabuti = "jabuti.cli:app"

[tool.setuptools.dynamic]
version = { attr = "jabuti.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# Templates are package resources read through importlib.resources.
[tool.setuptools.package-data]
jabuti = ["templates/**/*.tpl"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["jabuti"]
